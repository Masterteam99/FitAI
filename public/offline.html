<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline — FitAI</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #0d1117; color: #e6edf3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
      .box { max-width: 420px; }
      .logo { font-size: 28px; font-weight: 700; color: #22c55e; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #9ca3af; line-height: 1.5; margin: 0 0 24px; }
      button { background: #22c55e; color: #0d1117; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">FitAI</div>
      <h1>Sei offline</h1>
      <p>Sembra che tu non sia connesso a internet. Controlla la connessione e riprova.</p>
      <button onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
